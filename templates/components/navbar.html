{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>প্রতিশ্রুতি</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      color: #514343;
      background: linear-gradient(
        -45deg,
        rgba(227, 0, 253, 0.18),
        rgba(233, 30, 99, 0.18),
        rgba(155, 89, 182, 0.3),
        rgba(233, 30, 99, 0.3)
      );
      background-size: 400% 400%;
      animation: gradientBG 30s ease infinite;
    }
    @keyframes gradientBG {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .navbar {
      background: linear-gradient(90deg, rgba(227, 0, 253, 0.25), rgba(233, 30, 99, 0.27));
      background-size: 200% 200%;
      animation: gradientNav 6s ease infinite;
      box-shadow: 0 2px 6px rgba(227, 0, 253, 0.39);
      padding: 1rem 0;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    @keyframes gradientNav {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .navbar-brand strong {
      background: linear-gradient(90deg, #3d2e4e, rgba(233, 30, 99, 0.42));
      background-size: 200% 200%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: gradientText 6s ease infinite;
    }
    @keyframes gradientText {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .nav-link {
      font-size: 0.95rem;
      font-weight: 500;
      color: #fff !important;
      margin: 0 0.5rem;
      transition: color 0.3s;
    }
    .nav-link:hover {
      color: #ddd !important;
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand d-flex align-items-center" href="#">
        <img src="{% static 'images/img2.png' %}" alt="Logo" width="90" height="90" class="me-2">
        <strong>প্রতিশ্রুতি</strong>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto align-items-center">
          <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'about' %}">About</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'faq' %}">FAQ</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'counselors' %}">Counselors</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'lawyers' %}">Lawyers</a></li>
          <li class="nav-item"><a class="nav-link" href="{% url 'donate' %}">Donate</a></li>
          <li class="nav-item"><a class="btn btn-outline-primary btn-hero" href="{% url 'login' %}">Login</a></li>
          <li class="nav-item"><a class="btn btn-primary btn-hero" href="{% url 'signup' %}">Signup</a></li>
        </ul>
      </div>
    </div>
  </nav>
